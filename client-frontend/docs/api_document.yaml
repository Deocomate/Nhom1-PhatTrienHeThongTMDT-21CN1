openapi: "3.1.0"
info:
  title: "api_backend API"
  description: "api_backend API"
  version: "1.0.0"
servers:
  - url: "https://api_backend"
paths:
  /api/customerCares:
    post:
      summary: "POST api/customerCares"
      operationId: "createContact"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCareCreationRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerCareResponse"
components:
  schemas:
    CustomerCareCreationRequest:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
        content:
          type: "string"
    CustomerResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        email:
          type: "string"
        fullName:
          type: "string"
        gender:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
    CustomerCareResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
        content:
          type: "string"
        customerResponse:
          $ref: "#/components/schemas/CustomerResponse"