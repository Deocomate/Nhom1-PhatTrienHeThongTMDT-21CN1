components:
  schemas:
    CustomerCareCreationRequest:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
        content:
          type: "string"
    CustomerResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        email:
          type: "string"
        fullName:
          type: "string"
        gender:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
    CustomerCareResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        email:
          type: "string"
        phoneNumber:
          type: "string"
        address:
          type: "string"
        content:
          type: "string"
        customerResponse:
          $ref: "#/components/schemas/CustomerResponse"
    ProductImageResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        productId:
          type: "integer"
          format: "int32"
        url:
          type: "string"
    CommentCreationRequest:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int32"
        customerId:
          type: "integer"
          format: "int32"
        content:
          type: "string"
    ReplyCommentResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        commentId:
          type: "integer"
          format: "int32"
        replyContent:
          type: "string"
    CommentResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        productId:
          type: "integer"
          format: "int32"
        customerId:
          type: "integer"
          format: "int32"
        customerName:
          type: "string"
        content:
          type: "string"
        replyCommentResponses:
          type: "array"
          items:
            $ref: "#/components/schemas/ReplyCommentResponse"
    ReplyComment:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        commentId:
          type: "integer"
          format: "int32"
        replyContent:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    Comment:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        productId:
          type: "integer"
          format: "int32"
        customerId:
          type: "integer"
          format: "int32"
        content:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        replyComments:
          type: "array"
          items:
            $ref: "#/components/schemas/ReplyComment"
    AuthenticationRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
    AuthenticationResponse:
      type: "object"
      properties:
        authenticated:
          type: "boolean"
        token:
          type: "string"
    LogoutRequest:
      type: "object"
      properties:
        token:
          type: "string"
    Void:
      type: "object"
      properties: { }
    IntrospectRequest:
      type: "object"
      properties:
        token:
          type: "string"
    IntrospectResponse:
      type: "object"
